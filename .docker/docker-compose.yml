services:
  postgres:
    image: postgres:16
    container_name: postgres_local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Enable logical replication so CDC (Debezium) works out of the box locally.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - terraformresources_default

volumes:
  postgres_data:

networks:
  default:
    name: terraformresources_default
  terraformresources_default:
    name: terraformresources_default
    external: true
